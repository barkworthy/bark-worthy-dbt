version: 2

models:
  - name: int_inventory_in
    description: >
      Captures all inventory entering the business.
      Each row represents a received inventory event for a specific item,
      sourced from supplier deliveries (SKUs) or non-SKU inventory purchases
      such as packaging and freebies. Only physically received items with
      confirmed delivery dates and quantities are included.

    columns:
      - name: source_id
        description: >
          Identifier of the originating transaction that created the inventory
          movement (e.g., supplier shipment ID or non-SKU expense ID).
        tests: 
          - not_null
      - name: item_source
        description: >
          Origin of the inventory record. Typically 'supplier_order' for SKU
          deliveries or 'non_sku_purchase' for packaging, freebies, or other
          inventory-tracked purchases.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['supplier_order', 'non_sku_purchase']

      - name: item_name
        description: >
          Name or identifier of the inventory item received. For SKUs this is
          the SKU ID; for non-SKU purchases this corresponds to the purchase
          name recorded in the source sheet.
        tests:
          - not_null

      - name: item_type
        description: >
          Classification of the item based on purchase_type (e.g., sku,
          packaging, freebie). Used to distinguish inventory categories and
          support downstream filtering or grouping.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['sku', 'freebie', 'packaging']

      - name: quantity
        description: >
          Number of units received into inventory for the given item and
          transaction. Only positive, physically received quantities are
          included in this model.
        tests:
          - not_null

      - name: movement_date
        description: >
          Date the inventory was received and became available for use or sale.
          Used as the inventory movement date for stock-in events.
        tests:
          - not_null

  - name: int_inventory_out
    description: >
      Inventory outflow events representing product units leaving available inventory.
      This model consolidates three sources of stock depletion:
      valid customer orders, manual inventory movements (e.g. giveaways, replacements),
      and creator seeding shipments.

      Each row represents a quantity of a specific item leaving inventory on a given date.

    columns:

      - name: source_id
        description: Identifier from the originating source record
        tests:
          - not_null

      - name: item_source
        description: >
          Source type that generated the inventory movement.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['creator_seedings', 'inventory_movements', 'shopee', 'direct']

      - name: item_name
        description: Identifier of the product or item leaving inventory
        tests:
          - not_null

      - name: item_type
        description: Product category or type associated with the item being removed from inventory.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['sku', 'freebie', 'packaging']

      - name: quantity
        description: Number of units leaving inventory
      - name: movement_date
        description: Date representing when the inventory movement occurred
        tests:
          - not_null