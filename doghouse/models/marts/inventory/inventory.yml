version: 2

models:
  - name: fact_inventory_stock
    description: >
      Running inventory balance per item and movement date, calculated from aggregated daily inventory movements.

    columns:

      - name: item_name
        description: Identifier of the product or SKU.

      - name: item_type
        description: Category or type of the item (e.g. sku).

      - name: movement_date
        description: Timestamp of the inventory movement event.

      - name: total_quantity_moved
        description: >
          Net quantity moved at the given timestamp for the item.
          Positive values indicate stock increases, negative values indicate decreases.
        tests:
          - not_null

      - name: is_latest_movement
        description: >
          Boolean indicating whether the row represents the most recent
          movement for the item
        tests:
          - not_null

      - name: inventory_stock
        description: >
          Running inventory balance for the item, calculated by cumulatively
          summing movements in chronological order.
        tests:
          - not_null